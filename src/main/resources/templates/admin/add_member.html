<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add a New Member</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<!--
The admin directly chooses the group and year.
The identifier or username is generated in the same way as the username in Moodle.
The first letter of the first name is combined with the last name.
This information is extracted from the email address provided by the admin.
The admin has already verified that the student's email address is active.
-->

<body class="bg-light">

    <div class="container py-5">
        <div class="card shadow-sm mx-auto" style="max-width: 600px;">
            <div class="card-body p-4">

                <h1 class="h3 mb-4">Add a New Member</h1>

                <!-- Success message -->
                <th:block th:if="${successKey}">
                    <div th:replace="~{fragments/alerts :: success(#{${successKey}(${addedEmail})})}"></div>
                </th:block>

                <!-- General error message -->
                <th:block th:if="${errorKey}">
                    <div th:replace="~{fragments/alerts :: error(#{${errorKey}})}"></div>
                </th:block>

                <form th:action="@{/members}" method="post">

                    <!-- CSRF protection -->
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <!-- Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" name="email" class="form-control" th:value="${email}"
                            th:classappend="${emailErrorKey != null} ? 'is-invalid'" required>

                        <div class="invalid-feedback" th:if="${emailErrorKey}" th:text="#{${emailErrorKey}}">
                        </div>
                    </div>

                    <!-- Username -->
                    <div class="mb-3">
                        <label for="identifiant" class="form-label">Username</label>
                        <input type="text" id="identifiant" name="identifiant" class="form-control" readonly>

                        <div class="form-text">
                            Generated automatically from the email address.
                        </div>
                    </div>

                    <!-- Role -->
                    <div class="mb-3">
                        <label for="role" class="form-label">Role</label>

                        <select id="role" name="role" class="form-select" required>

                            <option value="" disabled th:selected="${selectedRole == null}">
                                Select a role
                            </option>

                            <option th:each="role : ${roles}" th:value="${role.name()}" th:text="${role.value}"
                                th:selected="${role.name() == selectedRole}">
                            </option>

                        </select>
                    </div>

                    <!-- Year and group -->
                    <div class="row">

                        <!-- Year -->
                        <div class="col-md-6 mb-3">
                            <label for="annee" class="form-label">Year</label>

                            <select id="annee" name="annee" class="form-select" required>

                                <option value="" disabled th:selected="${annee == null}">
                                    Select a year
                                </option>

                                <option value="L1" th:selected="${annee == 'L1'}">
                                    Licence 1
                                </option>

                                <option value="L2" th:selected="${annee == 'L2'}">
                                    Licence 2
                                </option>

                                <option value="L3" th:selected="${annee == 'L3'}">
                                    Licence 3
                                </option>

                                <option value="M1" th:selected="${annee == 'M1'}">
                                    Master 1
                                </option>

                                <option value="M2" th:selected="${annee == 'M2'}">
                                    Master 2
                                </option>

                            </select>
                        </div>

                        <!-- Group -->
                        <div class="col-md-6 mb-3">
                            <label for="groupe" class="form-label">Group</label>

                            <select id="groupe" name="groupe" class="form-select" required>

                                <option value="" disabled th:selected="${groupe == null}">
                                    Select a group
                                </option>

                                <option value="A" th:selected="${groupe == 'A'}">
                                    Group A
                                </option>

                                <option value="B" th:selected="${groupe == 'B'}">
                                    Group B
                                </option>

                                <option value="C" th:selected="${groupe == 'C'}">
                                    Group C
                                </option>

                                <option value="D" th:selected="${groupe == 'D'}">
                                    Group D
                                </option>

                            </select>
                        </div>

                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Add Member
                    </button>

                </form>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/handle-user.js"></script>

</body>

</html>

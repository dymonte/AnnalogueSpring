<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{member.add.title}">Add a New Member</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<!--
The admin directly chooses the group and year.
The identifier or username is generated in the same way as the username in Moodle.
The first letter of the first name is combined with the last name.
This information is extracted from the email address provided by the admin.
The admin has already verified that the student's email address is active.
-->

<body class="bg-light">
    <div th:insert="~{navbar.html}"></div>

    <div class="container py-5">
        <div class="card shadow-sm mx-auto" style="max-width: 700px;">
            <div class="card-body p-4">

                <h1 class="h3 mb-4" th:text="#{member.add.title}">Add a New Member</h1>

                <!-- Success message -->
                <th:block th:if="${successKey}">
                    <div th:replace="~{fragments/alerts :: success(#{${successKey}(${addedEmail})})}"></div>
                </th:block>

                <!-- General error message -->
                <th:block th:if="${errorKey}">
                    <div th:replace="~{fragments/alerts :: error(#{${errorKey}})}"></div>
                </th:block>

                <form th:action="@{/members/add}" method="post">

                    <!-- CSRF protection -->
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <!-- Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label" th:text="#{member.email}">Email</label>
                        <input type="email" id="email" name="email" class="form-control" th:value="${email}"
                            th:classappend="${emailErrorKey != null} ? 'is-invalid'" required>

                        <div class="invalid-feedback" th:if="${emailErrorKey}" th:text="#{${emailErrorKey}}">
                        </div>
                    </div>

                    <!-- Username -->
                    <div class="mb-3">
                        <label for="username" class="form-label" th:text="#{member.username}">Username</label>
                        <input type="text" id="username" name="enteredUsername" class="form-control" th:value="${enteredUsername}"
                            maxlength="50" pattern="[a-zA-Z0-9._\-]{3,50}" th:title="#{error.user.username.invalid}"
                            th:classappend="${usernameErrorKey != null} ? 'is-invalid'" required>

                        <div class="form-text" th:text="#{member.username.hint}"></div>

                        <!-- filled by handle-user.js; the texts come from messages.properties -->
                        <div id="username-feedback" class="small" th:attr="data-available=#{info.user.username.available},
                                      data-taken=#{warning.user.username.taken},
                                      data-use=#{action.user.username.use}">
                        </div>

                        <div class="invalid-feedback" th:if="${usernameErrorKey}" th:text="#{${usernameErrorKey}}">
                        </div>
                    </div>

                    <!-- Role -->
                    <div class="mb-3">
                        <label for="role" class="form-label" th:text="#{member.role}">Role</label>

                        <select id="role" name="role" class="form-select"
                            th:classappend="${roleErrorKey != null} ? 'is-invalid'" required>

                            <option value="" disabled th:selected="${selectedRole == null}"
                                th:text="#{member.role.select}">Select a role</option>

                            <option th:each="role : ${roles}" th:value="${role.name()}"
                                th:text="#{${'role.' + role.name()}}" th:selected="${role.name() == selectedRole}">
                            </option>

                        </select>

                        <div class="invalid-feedback" th:if="${roleErrorKey}" th:text="#{${roleErrorKey}}">
                        </div>
                    </div>

                    <!-- Academic year, level and group (students only) -->
                    <div class="row">

                        <!-- Academic year: value 2026, displayed 2026-2027 -->
                        <div class="col-md-4 mb-3">
                            <label for="year" class="form-label" th:text="#{member.year}">Academic year</label>

                            <select id="year" name="year" class="form-select"
                                th:classappend="${yearErrorKey != null} ? 'is-invalid'" required>

                                <option value="" disabled th:selected="${year == null}" th:text="#{member.year.select}">
                                    Select a year</option>

                                <option th:each="y : ${academicYears}" th:value="${y}" th:text="${y} + '-' + ${y + 1}"
                                    th:selected="${y == year}">
                                </option>

                            </select>

                            <div class="invalid-feedback" th:if="${yearErrorKey}" th:text="#{${yearErrorKey}}">
                            </div>
                        </div>

                        <!-- Level: L1, L2, L3, M1, M2 -->
                        <div class="col-md-4 mb-3">
                            <label for="level" class="form-label" th:text="#{member.level}">Level</label>

                            <select id="level" name="level" class="form-select"
                                th:classappend="${levelErrorKey != null} ? 'is-invalid'" required>

                                <option value="" disabled th:selected="${selectedLevel == null}"
                                    th:text="#{member.level.select}">Select a level</option>

                                <option th:each="l : ${levels}" th:value="${l.name()}" th:text="${l.name()}"
                                    th:selected="${l.name() == selectedLevel}">
                                </option>

                            </select>

                            <div class="invalid-feedback" th:if="${levelErrorKey}" th:text="#{${levelErrorKey}}">
                            </div>
                        </div>

                        <!-- Group -->
                        <div class="col-md-4 mb-3">
                            <label for="group" class="form-label" th:text="#{member.group}">Group</label>

                            <select id="group" name="group" class="form-select"
                                th:classappend="${groupErrorKey != null} ? 'is-invalid'" required>

                                <option value="" disabled th:selected="${group == null}"
                                    th:text="#{member.group.select}">Select a group</option>

                                <option value="A" th:selected="${group == 'A'}" th:text="#{member.group.option('A')}">
                                    Group A</option>
                                <option value="B" th:selected="${group == 'B'}" th:text="#{member.group.option('B')}">
                                    Group B</option>
                                <option value="C" th:selected="${group == 'C'}" th:text="#{member.group.option('C')}">
                                    Group C</option>
                                <option value="D" th:selected="${group == 'D'}" th:text="#{member.group.option('D')}">
                                    Group D</option>

                            </select>

                            <div class="invalid-feedback" th:if="${groupErrorKey}" th:text="#{${groupErrorKey}}">
                            </div>
                        </div>

                    </div>

                    <button type="submit" class="btn btn-primary w-100" th:text="#{member.submit}">
                        Add Member
                    </button>

                </form>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/handle-user.js"></script>

</body>

</html>

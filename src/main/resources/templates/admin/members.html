<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSRF token for scripts (used by the acceptance tests) -->
    <meta name="_csrf" th:content="${_csrf.token}">
    <title th:text="#{members.title}">Members</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div th:insert="~{navbar.html}"></div>

    <div class="container py-5">
        <div class="card shadow-sm mx-auto" style="max-width: 900px;">
            <div class="card-body p-4">

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1 class="h3 mb-0" th:text="#{members.title}">Members</h1>
                    <a class="btn btn-primary" th:href="@{/members/add}" th:text="#{members.add}">Add a member</a>
                </div>

                <!-- Success message -->
                <th:block th:if="${successKey}">
                    <div
                        th:replace="~{fragments/alerts :: success(#{${successKey}(${changedUsername ?: deletedUsername})})}">
                    </div>
                </th:block>

                <!-- Error message -->
                <th:block th:if="${errorKey}">
                    <div th:replace="~{fragments/alerts :: error(#{${errorKey}})}"></div>
                </th:block>

                <!-- filter by role (GET /members?role=PROF) -->
                <form th:action="@{/membersblblb}" method="get" id="role-filter"
                    class="d-flex gap-2 align-items-center mb-3">
                    <label for="filter-role" class="form-label mb-0" th:text="#{members.filter.role}">Filter by
                        role</label>
                    <select id="filter-role" name="role" class="form-select form-select-sm w-auto"
                        onchange="this.form.submit()">
                        <option value="" th:text="#{members.filter.all}" th:selected="${selectedFilter == ''}">All roles
                        </option>
                        <option th:each="filterRole : ${filterRoles}" th:value="${filterRole.name()}"
                            th:text="#{${'role.' + filterRole.name()}}"
                            th:selected="${filterRole.name() == selectedFilter}"></option>
                    </select>
                    <noscript>
                        <button type="submit" class="btn btn-sm btn-outline-secondary"
                            th:text="#{members.filter.submit}">Filter</button>
                    </noscript>
                </form>

                <p th:if="${#lists.isEmpty(users)}" class="text-muted mb-0"
                    th:text="${selectedFilter == null or selectedFilter == ''} ? #{members.empty} : #{members.filter.empty}">
                </p>

                <div th:unless="${#lists.isEmpty(users)}" class="table-responsive">
                    <table class="table table-striped align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th scope="col" th:text="#{members.username}">Username</th>
                                <th scope="col" th:text="#{members.email}">Email</th>
                                <th scope="col" th:text="#{members.role}">Role</th>
                                <th scope="col" class="text-end" th:text="#{members.actions}">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- the email identifies the row: it is unique, the username is not -->
                            <tr th:each="user : ${users}" th:attr="data-email=${user.email}">
                                <td th:text="${user.username}"></td>
                                <td th:text="${user.email}"></td>
                                <td>
                                    <!-- a teacher can be switched between Teacher and Module manager -->
                                    <form th:if="${user.role.name() == 'PROF' or user.role.name() == 'RESPONSABLE'}"
                                        th:action="@{/members/{id}/role(id=${user.id})}" method="post"
                                        class="d-flex gap-2 role-form">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <input type="hidden" name="filter" th:value="${selectedFilter}">
                                        <select name="role" class="form-select form-select-sm role-select"
                                            th:attr="aria-label=#{members.role}">
                                            <option th:each="teacherRole : ${teacherRoles}"
                                                th:value="${teacherRole.name()}"
                                                th:text="#{${'role.' + teacherRole.name()}}"
                                                th:selected="${teacherRole == user.role}"></option>
                                        </select>
                                        <button type="submit" class="btn btn-sm btn-outline-primary role-btn"
                                            th:text="#{members.role.change}">Change</button>
                                    </form>
                                    <span th:unless="${user.role.name() == 'PROF' or user.role.name() == 'RESPONSABLE'}"
                                        th:text="#{${'role.' + user.role.name()}}"></span>
                                </td>
                                <td class="text-end">
                                    <!-- no delete button for the administrator -->
                                    <form th:unless="${user.role.name() == 'ADMIN'}"
                                        th:action="@{/members/{id}/delete(id=${user.id})}" method="post"
                                        th:attr="data-confirm=#{members.delete.confirm}"
                                        onsubmit="return confirm(this.dataset.confirm);">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <button type="submit" class="btn btn-sm btn-outline-danger delete-btn"
                                            th:text="#{members.delete}">Delete</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>

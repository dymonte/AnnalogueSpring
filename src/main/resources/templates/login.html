<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="#{login.title}">Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

    <div class="container py-5">
        <div class="row justify-content-center align-items-center h-100">
            <div class="col-4">
                <div class="card">
                    <div class="card-body">
                        <form action="/login" method="post">
                            <h2 class="mb-4" th:text="#{login.heading}">Login</h2>

                            <div th:if="${param.required}"
                                 class="alert alert-warning mb-3"
                                 role="alert"
                                 th:text="#{login.required}">
                                You must be logged in to access this page
                            </div>

                            <div class="form-group mb-3">
                                <label for="username" th:text="#{login.email}">Email address</label>
                                <input type="email" class="form-control" id="username" name="username" required
                                    autocomplete="email">
                            </div>

                            <div class="form-group mb-3">
                                <label for="password" th:text="#{login.password}">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required
                                    autocomplete="current-password">
                            </div>

                            <div id="error" th:if="${param.error}" class="alert alert-danger mb-3" role="alert"
                                th:text="${error}">
                            </div>

                            <div th:if="${param.logout}" class="alert alert-success mb-3" role="alert"
                                th:text="#{success.logout}">
                            </div>

                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                            <button type="submit" id="login-btn" class="btn btn-primary w-100"
                                th:text="#{login.submit}">Log in</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>

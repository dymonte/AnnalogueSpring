<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="container  ">

</div>

<div class="container py-5">
    <div class="row justify-content-center align-items-center h-100">
        <div class="col-4">
            <div class="card">
                <div class="card-body">
                    <form action="/login" method="post">
                        <h2 class="mb-4">Connexion</h2>
                        <div class="form-group mb-3">
                            <label for="username">Adresse email :</label>
                            <input type="username" class="form-control" id="username" name="username" required autocomplete="email">
                        </div>
                        <div class="form-group mb-3">
                            <label for="password">Mot de passe :</label>
                            <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
                        </div>

                        <div id="error" th:if="${param.error}" class="alert alert-danger mb-3" role="alert" th:text="${error}">
                        </div>

                        <div th:if="${param.logout}" class="alert alert-success mb-3" role="alert" th:text="#{success.logout}">
                        </div>

                        <input
                                type="hidden"
                                th:name="${_csrf.parameterName}"
                                th:value="${_csrf.token}">
                        <button type="submit" id="login-btn" class="btn btn-primary w-100">Se connecter</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>

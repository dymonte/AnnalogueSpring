<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm border-bottom py-3">
    <div class="container-fluid px-4">

        <!-- Brand -->
        <a class="navbar-brand fw-bold fs-4 text-primary me-4"
           th:href="@{/home}">
            <i class="bi bi-journal-bookmark-fill me-2"></i>
            <span th:text="#{nav.brand}">Annalogue</span>
        </a>

        <!-- Mobile toggle -->
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">

            <!-- Navigation links -->
            <ul class="navbar-nav me-lg-4 mb-3 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link px-3 fw-medium"
                       th:href="@{/}"
                       th:text="#{nav.home}">
                        Home
                    </a>
                </li>

                <li class="nav-item" th:if="${isAdmin == true}">
                    <a class="nav-link px-3 fw-medium"
                       th:href="@{/modules}"
                       th:text="#{nav.modules}">
                        Modules
                    </a>
                </li>

                <li class="nav-item" th:if="${isAdmin}">
                    <a class="nav-link px-3 fw-medium"
                       th:href="@{/admin}"
                       th:text="#{nav.admin}">
                        Admin Dashboard
                    </a>
                </li>

            </ul>

            <!-- Search bar -->
            <form th:action="@{/search}"
                  method="get"
                  class="d-flex flex-grow-1 mx-lg-3 my-3 my-lg-0"
                  role="search">

                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0">
                        <i class="bi bi-search text-secondary"></i>
                    </span>

                    <input
                            class="form-control bg-light border-start-0"
                            type="search"
                            name="query"
                            placeholder="Search publications or modules..."
                            aria-label="Search publications or modules"
                            required>

                    <button class="btn btn-primary px-3" type="submit">
                        Search
                    </button>
                </div>
            </form>

            <!-- User dropdown -->
            <ul class="navbar-nav ms-lg-3 mt-3 mt-lg-0">
                <li class="nav-item dropdown">

                    <a class="nav-link dropdown-toggle d-flex align-items-center gap-2 rounded px-3"
                       href="#"
                       role="button"
                       data-bs-toggle="dropdown"
                       aria-expanded="false"
                       id="dropdownLogout">

                        <i class="bi bi-person-circle fs-4 text-primary"></i>

                        <span class="fw-semibold" th:text="${username}">
                            User
                        </span>
                    </a>

                    <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 mt-2"
                        aria-labelledby="dropdownLogout">

                        <li>
                            <h6 class="dropdown-header">My Account</h6>
                        </li>

                        <li>
                            <a class="dropdown-item py-2"
                               th:href="@{/change-password}"
                               th:text="#{home.change.password}">
                                Change Password
                            </a>
                        </li>

                        <li>
                            <hr class="dropdown-divider">
                        </li>

                        <li>
                            <a class="dropdown-item py-2 text-danger"
                               id="logout"
                               href="#"
                               onclick="event.preventDefault(); document.getElementById('logoutForm').submit();"
                               th:text="#{nav.logout}">
                                Log Out
                            </a>
                        </li>

                    </ul>
                </li>
            </ul>

        </div>
    </div>

    <!-- CSRF-protected logout form -->
    <form id="logoutForm"
          th:action="@{/logout}"
          method="post"
          class="d-none">
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">
    </form>
</nav>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="addCorrection(publication)" class="mt-4">

    <!-- Existing corrections -->
    <div th:if="${publication.corrections != null
                 and !publication.corrections.isEmpty()}"
         class="mb-4">

        <h5 class="mb-3">Corrections</h5>

        <div class="row row-cols-1 g-3">

            <div class="col"
                 th:each="correction : ${publication.corrections}">

                <div class="card border-secondary-subtle shadow-sm">
                    <div class="card-body">

                        <div class="d-flex justify-content-between
                                    align-items-start gap-3">

                            <div class="flex-grow-1">

                                <h6 class="card-title mb-2"
                                    th:text="${correction.title}">
                                    Correction title
                                </h6>

                                <p class="card-text text-muted small mb-3">
                                    Published by
                                    <span th:text="${correction.authorComment.username}">
                                        author
                                    </span>
                                </p>

                                <a th:text="#{publication.download}"
                                   th:href="@{/files/{id}(id=${correction.id})}"
                                   class="btn btn-sm btn-primary">
                                    Download
                                </a>
                            </div>

                            <form th:action="@{/deleteCorrection/{id}(id=${correction.id})}"
                                  method="post"
                                  onsubmit="return confirm('Are you sure you want to delete this correction?');">

                                <button type="submit"
                                        class="btn btn-sm btn-outline-danger">
                                    Delete
                                </button>

                            </form>

                        </div>

                    </div>
                </div>

            </div>

        </div>
    </div>

    <!-- Empty state -->
    <div th:if="${publication.corrections == null
                 or publication.corrections.isEmpty()}"
         class="alert alert-light border small">
        No corrections have been published yet.
    </div>

    <!-- Clickable area to show the form -->
    <div class="card mt-4">
        <div class="card-body">

            <div class="d-flex align-items-center justify-content-center gap-2 p-3 py-1"
                 role="button"
                 tabindex="0"
                 data-bs-toggle="collapse"
                 th:data-bs-target="'#correction-form-' + ${publication.id}"
                 th:aria-controls="'correction-form-' + ${publication.id}"
                 aria-expanded="false"
                 style="cursor: pointer;">

                <span class="fs-4">+</span>
                <span class="fw-semibold">Add a correction</span>

            </div>

            <!-- Collapsible form -->
            <div class="collapse mt-3"
                 th:id="'correction-form-' + ${publication.id}">

                <div class="border-top pt-3">

                    <form th:action="@{/publication/{id}/addCorrection(id=${publication.id})}"
                          method="post"
                          enctype="multipart/form-data">

                        <div class="mb-3">
                            <label th:for="'correction-title-' + ${publication.id}"
                                   class="form-label">
                                Correction title
                            </label>

                            <input type="text"
                                   class="form-control"
                                   th:id="'correction-title-' + ${publication.id}"
                                   name="title"
                                   maxlength="255"
                                   placeholder="e.g. Corrected exercise 3"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label th:for="'correction-file-' + ${publication.id}"
                                   class="form-label">
                                Correction file
                            </label>

                            <input type="file"
                                   class="form-control"
                                   th:id="'correction-file-' + ${publication.id}"
                                   name="file"
                                   required>
                        </div>

                        <button type="submit" class="btn btn-success">
                            Upload correction
                        </button>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>

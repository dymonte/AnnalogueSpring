<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="#{home.title}">Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

    <div th:insert="~{navbar.html}"></div>

    <h1><span th:text="#{home.welcome}">Welcome</span> <span th:text="${username}"></span></h1>

    <a href="/change-password" class="btn btn-primary" th:text="#{home.change.password}">Change password</a>
    <a href="/members/add" class="btn btn-primary" th:text="#{home.add.member}">Add Member</a>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

</body>

</html>

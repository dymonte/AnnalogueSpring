<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="#{home.title}">Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

    <div th:insert="~{navbar.html}"></div>

    <h1><span th:text="#{home.welcome}">Welcome</span> </h1>

    <a href="/members/add" class="btn btn-primary" th:text="#{home.add.member}">Add Member</a>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>


    <button type="button"
        th:if="${canCreateModuleAndPublication}"
        class="btn btn-primary position-fixed bottom-0 end-0 m-4 rounded-circle shadow fs-2 d-flex align-items-center justify-content-center"
        style="width: 3.5rem; height: 3.5rem;" data-bs-toggle="modal" data-bs-target="#createModal"
        th:aria-label="#{home.create.title}" th:text="#{home.upload}">+</button>

    <div class="modal fade" id="createModal" tabindex="-1" aria-labelledby="createModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="createModalLabel" th:text="#{home.create.title}">What would you like to create?</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"
                        th:aria-label="#{home.create.close}"></button>
                </div>
                <div class="modal-body d-grid gap-2">
                    <a href="/upload" class="btn btn-primary" th:text="#{home.create.publication}">Create a publication</a>
                    <a href="/modules/add" class="btn btn-outline-primary" th:text="#{home.create.module}">Create a module</a>
                </div>
            </div>
        </div>
    </div>

</body>

</html>

<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Registered users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="bg-light">
<div th:insert="~{navbar.html}"></div>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-10">
            <div class="card shadow-sm">

                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Registered users</h5>
                    <span class="badge bg-secondary" th:text="${#lists.size(users)}">0</span>
                </div>

                <div class="card-body p-4">

                    <div th:if="${#lists.isEmpty(users)}" class="alert alert-info mb-0">
                        No registered users at the moment.
                    </div>

                    <div th:unless="${#lists.isEmpty(users)}" class="table-responsive">
                        <table class="table table-striped table-hover align-middle mb-0">
                            <thead class="table-light">
                            <tr>
                                <th scope="col">Username</th>
                                <th scope="col">Email</th>
                                <th scope="col">Role</th>
                                <th scope="col">Level</th>
                                <th scope="col">Year</th>
                                <th scope="col">Group</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="user : ${users}">
                                <td th:text="${user.username}">user_example</td>
                                <td th:text="${user.email}">user@example.com</td>
                                <td><span class="badge bg-primary" th:text="${user.role}">STUDENT</span></td>

                                <td th:text="${user.level != null} ? ${user.study_level} : '-'">M2</td>
                                <td th:text="${user.year != null} ? ${user.year_level} : '-'">2026-2027</td>
                                <td th:text="${user.group != null} ? ${user.group_name} : '-'">Group 1</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
</body>

</html>

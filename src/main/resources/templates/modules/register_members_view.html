<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>My Module Registrations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div th:insert="~{navbar.html}"></div>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-12">

            <div class="card shadow-sm">

                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">My Module Registrations</h5>
                </div>

                <div class="card-body p-4">
                    <div th:if="${success != null}"
                         class="alert alert-success alert-dismissible fade show"
                         role="alert" id="success">
                        <span th:text="${success}"></span>
                        <button type="button" class="btn-close"
                                data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <div th:if="${error != null}"
                         class="alert alert-danger alert-dismissible fade show"
                         role="alert" id ="error">
                        <span th:text="${error}"></span>
                        <button type="button" class="btn-close"
                                data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    <div th:if="${#lists.isEmpty(inscriptions)}"
                         class="alert alert-info mb-0">
                        There are currently no registrations for the modules you manage.
                    </div>

                    <div th:unless="${#lists.isEmpty(inscriptions)}"
                         class="table-responsive">

                        <table class="table table-striped table-hover align-middle mb-0">

                            <thead class="table-light">
                            <tr>
                                <th>Member</th>
                                <th>Email</th>
                                <th>Module</th>
                                <th>Registration Type</th>
                                <th>Editor</th>
                                <th>Actions</th>
                            </tr>
                            </thead>

                            <tbody>
                            <tr th:each="inscription : ${inscriptions}">

                                <td th:text="${inscription.user.username}">
                                    Student Name
                                </td>

                                <td th:text="${inscription.user.email}">
                                    student@example.com
                                </td>

                                <!-- Replace 'name' with the actual field name in ModuleEntity -->
                                <td th:text="${inscription.module.name}">
                                    Module Name
                                </td>

                                <td>
                                    <span class="badge bg-primary"
                                          th:text="${inscription.inscriptionType}">
                                        TYPE
                                    </span>
                                </td>

                                <td>
                                    <span class="badge"
                                          th:classappend="${inscription.editor}
                                              ? ' bg-success' : ' bg-secondary'"
                                          th:text="${inscription.editor}
                                              ? 'Yes' : 'No'">
                                        No
                                    </span>
                                </td>

                                <td>
                                    <form th:action="@{/module-enrollments/{id}/toggle-editor(id=${inscription.id})}"
                                          method="post"
                                          class="d-inline">

                                        <button type="submit"
                                                class="btn btn-sm"
                                                th:classappend="${inscription.editor}
                    ? ' btn-outline-secondary'
                    : ' btn-success'"
                                                th:text="${inscription.editor}
                    ? 'Remove editor'
                    : 'Make editor'">
                                        </button>
                                    </form>


                                    <form th:action="@{/module-enrollments/{id}/delete(id=${inscription.id})}"
                                          method="post"
                                          class="d-inline"
                                          onsubmit="return confirm('Are you sure you want to delete this registration?');">

                                        <button type="submit"
                                                class="btn btn-sm btn-danger">
                                            Delete
                                        </button>
                                    </form>
                                </td>

                            </tr>
                            </tbody>

                        </table>
                    </div>

                    <div class="mt-3">
                        <a th:href="@{/module-enrollments/new}"
                           class="btn btn-primary">
                            Add Registration
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

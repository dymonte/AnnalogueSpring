<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Upload de Fichier</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div th:insert="~{navbar.html}"></div>

<div class="container mt-5">
    <h2 class="mb-4">Upload a file</h2>

    <div th:if="${error}" class="alert alert-danger" role="alert">
        <span th:text="#{${error}}"></span>
    </div>

    <div th:if="${success}" class="alert alert-success" role="alert">
        <span th:text="#{${success}}"></span>
    </div>

    <form action="/files" method="POST" enctype="multipart/form-data" class="w-50">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="mb-3">
            <label for="fileInput" class="form-label"><span th:text="#{upload.choose}">Choose a file</span></label>
            <input type="file" accept=".pdf" id="fileInput" name="file" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="name" class="form-label"><span th:text="#{upload.name}">Name</span></label>
            <input type="text" id="name" name="name" class="form-control" th:value="${name}" required>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label"><span th:text="#{upload.description}">Description</span></label>
            <input type="text" id="description" name="description" class="form-control" th:value="${description}">
        </div>

        <div class="mb-3">
            <label for="module" class="form-label"><span th:text="#{upload.module}">Choose a module</span></label>
            <select id="module" name="moduleId" class="form-select" required>
                <option th:each="module : ${modules}" th:value="${module.id}" th:text="${module.name}" th:selected="${moduleId != null && moduleId == module.id}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label for="fileType" class="form-label">File type</label>
            <select id="fileType" name="fileType" class="form-select" required>
                <option th:each="type : ${fileType}" th:value="${type}" th:text="${type}" th:selected="${selectedFileType != null && selectedFileType == type.name()}"></option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary"><span th:text="#{upload.submit}">Upload</span></button>
    </form>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Delete user</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="bg-light">
<div th:insert="~{navbar.html}"></div>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h2 class="card-title mb-4 text-center">Deleted a user for the module</h2>
                    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                    <form th:action="@{/change-password}" method="post" class="needs-validation" novalidate>
                        <div class="mb-3">

                            <!-- Deleted a user based on their email address -->
                            <label for="emailUser" class="form-label fw-bold">User's email</label>
                            <input type="email" class="form-control" id="emailUser" name="emailUser" autocomplete="email" required>

                            <p class="text-danger small" th:if="${userNotAlreadyRegisterError}"
                               th:text="${userNotAlreadyRegisterError}"></p>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Register</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>

</html>

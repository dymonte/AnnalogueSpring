<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Register users from group</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="bg-light">
<div th:insert="~{navbar.html}"></div>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h2 class="card-title mb-4 text-center">Register a group for the module</h2>

                    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                    <form th:action="@{/module/users/register}" method="post">
                        <div class="mb-3">
                            <label for="group" class="form-label fw-bold">
                                Select a group
                            </label>

                            <select id="group" name="group" class="form-select" required>
                                <option value="" disabled selected>Select a group</option>

                                <!-- To adapt depend on how groups are implemented -->
                                <option th:each="group : ${groups}"
                                        th:value="${group.id}"
                                        th:text="${group.name}">
                                </option>
                            </select>
                        </div>

                        <!-- Case where no group exists -->
                        <div th:if="${groups == null or groups.isEmpty()}"
                             class="alert alert-warning mt-2"
                             role="alert">
                            No groups are available.
                        </div>

                        <button type="submit"
                                class="btn btn-primary w-100"
                                th:disabled="${groups == null or groups.isEmpty()}">
                            Register
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>

</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{inscription.group.title}">Register a group</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div th:insert="~{navbar.html}"></div>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h2 class="card-title mb-4 text-center" th:text="#{inscription.group.title}">Register a group
                        </h2>

                        <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
                        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

                        <form th:action="@{/module-enrollments/group}" method="post">

                            <div class="mb-3">
                                <label for="moduleId" class="form-label fw-bold"
                                    th:text="#{inscription.group.module}">Module</label>
                                <select class="form-select" id="moduleId" name="moduleId" required>
                                    <option value="" disabled selected th:text="#{inscription.group.module.choose}">
                                        Choose a module</option>
                                    <option th:each="module : ${modules}" th:value="${module.id}"
                                        th:text="${module.name}"></option>
                                </select>
                                <div class="alert alert-warning mt-2" th:if="${#lists.isEmpty(modules)}"
                                    th:text="#{inscription.group.no.modules}">You do not manage any module.</div>
                            </div>

                            <div class="mb-4">
                                <label for="group" class="form-label fw-bold"
                                    th:text="#{inscription.group.group}">Group</label>
                                <select class="form-select" id="group" name="group" required>
                                    <option value="" disabled selected th:text="#{member.group.select}">Select a group
                                    </option>
                                    <option th:each="g : ${groups}" th:value="${g}" th:text="${g}"></option>
                                </select>
                                <div class="alert alert-warning mt-2" th:if="${#lists.isEmpty(groups)}"
                                    th:text="#{inscription.group.no.groups}">No groups are available.</div>
                            </div>

                            <button type="submit" id="enrolle-group-btn" class="btn btn-primary w-100"
                                th:disabled="${#lists.isEmpty(groups) or #lists.isEmpty(modules)}"
                                th:text="#{inscription.group.submit}">Register the group</button>
                        </form>

                        <div class="text-center mt-3">
                            <a th:href="@{/module-enrollments}" class="text-decoration-none"
                                th:text="#{inscription.group.back}">Back to registrations</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>

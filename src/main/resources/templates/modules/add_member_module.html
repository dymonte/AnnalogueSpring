<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Register user</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="bg-light">
<div th:insert="~{navbar.html}"></div>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h2 class="card-title mb-4 text-center">Register a user for the module</h2>

                    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                    <form th:action="@{/module/users/register}" method="post">

                        <div class="mb-3">
                            <label for="moduleId" class="form-label fw-bold">
                                Select a module
                            </label>

                            <select class="form-select"
                                    id="moduleId"
                                    name="moduleId"
                                    th:classappend="${moduleIdError != null} ? 'is-invalid' : ''"
                                    required>

                                <option value=""
                                        disabled
                                        th:selected="${selectedModuleId == null}">
                                    Choose a module
                                </option>

                                <option th:each="module : ${modules}"
                                        th:value="${module.id}"
                                        th:text="${module.name}"
                                        th:selected="${selectedModuleId != null
                and selectedModuleId.equals(module.id)}">
                                </option>
                            </select>

                            <div class="invalid-feedback"
                                 th:if="${moduleIdError != null}"
                                 th:text="${moduleIdError}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="emailUser" class="form-label fw-bold">
                                User's email
                            </label>

                            <input type="email"
                                   class="form-control"
                                   th:classappend="${emailUserError != null
           or userAlreadyRegisterError != null} ? 'is-invalid' : ''"
                                   id="emailUser"
                                   name="emailUser"
                                   th:value="${emailUser}"
                                   autocomplete="off"
                                   required>

                            <div class="invalid-feedback"
                                 th:if="${emailUserError != null}"
                                 th:text="${emailUserError}">
                            </div>

                            <div class="invalid-feedback"
                                 th:if="${userAlreadyRegisterError != null}"
                                 th:text="${userAlreadyRegisterError}">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Register
                        </button>

                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
</body>

</html>

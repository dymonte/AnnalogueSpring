<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{module.add.title}">Create Module</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div th:insert="~{navbar.html}"></div>
    <div class="container py-5">
        <div class="card shadow-sm mx-auto" style="max-width: 600px;">
            <div class="card-body p-4">
                <h1 class="h3 mb-4">Create a new module</h1>

                <th:block th:if="${successKey}">
                    <div th:replace="~{fragments/alerts :: success(#{${successKey}(${createdModuleName})})}"></div>
                </th:block>

                <th:block th:if="${errorKey}">
                    <div th:replace="~{fragments/alerts :: error(#{${errorKey}})}"></div>
                </th:block>

                <form th:action="@{/modules/add}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <div class="mb-3">
                        <label for="name" class="form-label">Module name</label>
                        <input type="text" id="name" name="name" class="form-control" th:value="${name}"
                            th:classappend="${nameErrorKey != null} ? 'is-invalid'" required maxlength="255">
                        <div class="invalid-feedback" th:if="${nameErrorKey}"></div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Create</button>
                </form>
            </div>
        </div>
    </div>
</body>

</html>

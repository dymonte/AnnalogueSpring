<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${module.name}">Module Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">

<!-- Navigation Bar -->
<div th:insert="~{navbar.html}"></div>

<div class="container py-5">

    <!-- Module Header -->
    <div class="mb-4 pb-2 border-bottom d-flex align-items-center justify-content-between">
        <div>
            <span class="badge bg-primary-subtle text-primary mb-2 px-3 py-1 rounded-pill fw-semibold">Module</span>
            <h1 class="h3 fw-bold text-dark mb-0" th:text="${module.name}">Module Name</h1>
        </div>
    </div>



    <!-- Publications List -->
    <div class="row row-cols-1 g-4">
        <div class="col" th:each="publication: ${publications}">

            <!-- Main Publication Card -->
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">

                <!-- Publication Header -->
                <div class="card-header bg-white border-bottom py-3 px-4 d-flex align-items-center justify-content-between">
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi bi-journal-text fs-5 text-primary"></i>
                        <h5 class="card-title fw-bold text-dark mb-0" th:text="${publication.name}">Publication Title</h5>
                    </div>
                    <span class="badge bg-secondary-subtle text-secondary px-2 py-1 small" th:text="${publication.fileType}">PDF</span>
                </div>

                <div class="card-body p-4">
                    <!-- Description -->
                    <p class="text-muted mb-4" th:if="${publication.description != null}" th:text="${publication.description}"></p>

                    <!-- Main Action Buttons -->
                    <div class="d-flex flex-wrap gap-2 mb-4 pb-3 border-bottom">
                        <a th:href="@{/publications/{id}/details(id=${publication.id})}"
                           class="btn btn-outline-primary btn-sm d-inline-flex align-items-center gap-1 px-3">
                            <i class="bi bi-eye"></i> View Details
                        </a>

                        <a th:href="@{/files/{id}(id=${publication.id})}"
                           class="btn btn-primary btn-sm d-inline-flex align-items-center gap-1 px-3">
                            <i class="bi bi-download"></i> <span th:text="#{publication.download}">Download</span>
                        </a>
                    </div>

                    <!-- Corrections Section Fragment -->
                    <div class="bg-light p-3 rounded-3 border">
                        <div th:replace="~{publications/add_correction :: addCorrection(${publication})}"></div>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${module.name}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div th:insert="~{navbar.html}"></div>

    <div class="container mt-5">
        <div class="card">
            <h5 class="card-header">
                <span th:text="${module.name}"></span>
            </h5>
            <div class="card-body">
                <div class="row row-cols-1 row-cols-md-2 g-4">
                  <div class="col" th:each="publication: ${publications}">
                    <div class="card h-100">
                      <div class="card-body">
                        <h5 class="card-title" th:text="${publication.name} + ' (' + ${publication.fileType} + ')'"></h5>
                        <p class="card-text" th:if="${publication.description != null}" th:text="${publication.description}"></p>
                        <a th:text="#{publication.download}" th:href="@{/files/{id}(id=${publication.id})}" class="btn btn-primary">Télécharger</a>
                        <div th:replace="~{publication/add_correction :: addCorrection(${publication})}"></div>
                      </div>
                    </div>
                  </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

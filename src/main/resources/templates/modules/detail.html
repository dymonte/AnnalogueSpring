<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${module.name}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div th:insert="~{navbar.html}"></div>

    <div class="container mt-5">
        <h1 th:text="${module.name}"></h1>
        <table class="table">
            <tr th:each="publication: ${publications}">
                <td th:text="${publication.name} + ' (' + ${publication.fileType} + ')'" />
                <td th:if="${publication.description != null}" th:text="${publication.description}" />
                <td><a th:text="#{publication.download}" th:href="@{/files/{id}(id=${publication.id})}">Download</a></td>
            </tr>
        </table>
    </div>
</body>
</html>

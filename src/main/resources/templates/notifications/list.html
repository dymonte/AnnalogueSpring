<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{nav.notifications}">Notifications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="bg-light">
    <div th:insert="~{navbar.html}"></div>

    <main class="container py-4">
        <h1 class="h3 mb-4" th:text="#{nav.notifications}">Notifications</h1>

        <p th:if="${#lists.isEmpty(notifications)}" class="text-muted" th:text="#{notification.empty}">
            No notifications
        </p>

        <div th:unless="${#lists.isEmpty(notifications)}" class="list-group shadow-sm">
            <div th:each="notification : ${notifications}"
                 class="list-group-item"
                 th:classappend="${notification.seen} ? '' : 'list-group-item-primary'">
                <p class="mb-1"
                   th:text="${#messages.msg(notification.type.messageKey, notification.content)}">
                    Notification
                </p>
                <small class="text-muted"
                       th:text="${#temporals.format(notification.createdAt, 'dd/MM/yyyy HH:mm')}">
                    Date
                </small>
            </div>
        </div>
    </main>
</body>

</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="#{password.title}">Change password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="bg-light">
    <div th:insert="~{navbar.html}"></div>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h2 class="card-title mb-4 text-center" th:text="#{password.title}">Change password</h2>
                        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                        <form th:action="@{/change-password}" method="post" class="needs-validation" novalidate>
                            <div class="mb-3">
                                <label for="currentPassword" class="form-label fw-bold"
                                    th:text="#{password.current}">Current password</label>
                                <input type="password" class="form-control" id="currentPassword" name="currentPassword"
                                    autocomplete="current-password" required>
                                <p class="text-danger small" th:if="${currentPasswordError}"
                                    th:text="${currentPasswordError}"></p>
                            </div>
                            <div class="mb-3">
                                <label for="newPassword" class="form-label fw-bold" th:text="#{password.new}">New
                                    password</label>
                                <input type="password" class="form-control" id="newPassword" name="newPassword"
                                    minlength="8" pattern="(?=.*[A-Za-z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}"
                                    th:title="#{password.new.hint}" autocomplete="new-password" required>
                                <div class="form-text" th:text="#{password.new.hint}"></div>
                                <p class="text-danger small" th:if="${newPasswordError}" th:text="${newPasswordError}">
                                </p>
                            </div>
                            <div class="mb-4">
                                <label for="confirmPassword" class="form-label fw-bold"
                                    th:text="#{password.confirm}">Confirm the new password</label>
                                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                                    autocomplete="new-password" required>
                                <p class="text-danger small" th:if="${confirmPasswordError}"
                                    th:text="${confirmPasswordError}"></p>
                            </div>
                            <button type="submit" class="btn btn-primary w-100" th:text="#{password.submit}">Change
                                password</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>


<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${publication.name}">Publication Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        .comments-scroll {
            max-height: 500px;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 0.5rem;
            border: 1px solid #dee2e6;
            border-radius: 0.5rem;
        }

        .comment-content {
            min-width: 0;
        }

        .comment-text {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            word-break: normal;
        }
    </style>
</head>

<body>
<div th:insert="~{navbar.html}"></div>

<div class="container mt-5">
    <div class="card shadow-sm">

        <div class="card-header">
            <i class="bi bi-file-earmark-text me-2"></i>
            <span th:text="${publication.name}"></span>
        </div>

        <div class="card-body">

            <p>
                <i class="bi bi-card-text me-2"></i>
                <strong>Description:</strong>
                <span th:text="${publication.description != null
                        ? publication.description : 'No description available'}"></span>
            </p>

            <p>
                <i class="bi bi-file-earmark me-2"></i>
                <strong>File Type:</strong>
                <span th:text="${publication.fileType}"></span>
            </p>

            <p>
                <i class="bi bi-calendar3 me-2"></i>
                <strong>Publication Date:</strong>
                <span th:text="${publication.createdAt != null
                        ? #temporals.format(publication.createdAt, 'MM/dd/yyyy HH:mm')
                        : 'Not available'}"></span>
            </p>

            <p>
                <i class="bi bi-person me-2"></i>
                <strong>Author:</strong>
                <span th:if="${publication.author != null}"
                      th:text="${publication.author.email}"></span>
                <span th:unless="${publication.author != null}">
                    Not available
                </span>
            </p>

            <!-- Publication actions -->
            <div class="d-flex gap-2 mt-4">
                <a th:href="@{/files/{id}(id=${publication.id})}"
                   class="btn btn-primary"
                   title="Download publication"
                   aria-label="Download publication">
                    <i class="bi bi-download"></i>
                </a>

                <a href="javascript:history.back()"
                   class="btn btn-outline-secondary"
                   title="Go back"
                   aria-label="Go back">
                    <i class="bi bi-arrow-left"></i>
                </a>
            </div>

            <hr class="my-4">

            <div th:replace="~{fragments/add-comment :: addComment}"></div>
        </div>
    </div>
</div>
</body>
</html>

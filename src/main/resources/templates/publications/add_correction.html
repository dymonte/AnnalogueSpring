<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="addCorrection(publication)" class="mt-2">

    <div class="d-flex align-items-center justify-content-between mb-3">
        <h6 class="fw-bold text-secondary mb-0">
            <i class="bi bi-file-earmark-check me-2"></i>Published Corrections
        </h6>
    </div>

    <!-- Existing Corrections List -->
    <div th:if="${publication.corrections != null and !publication.corrections.isEmpty()}" class="d-flex flex-column gap-3 mb-4">

        <div class="card border-0 shadow-sm rounded-3" th:each="correction : ${publication.corrections}">
            <div class="card-body p-3">

                <div class="d-flex justify-content-between align-items-start gap-3">
                    <div class="flex-grow-1">
                        <h6 class="fw-semibold text-dark mb-1" th:text="${correction.title}">
                            Correction Title
                        </h6>
                        <p class="text-muted small mb-2">
                            Published by
                            <span class="fw-medium text-dark" th:text="${correction.authorComment != null ? correction.authorComment.username : 'Unknown author'}">
                                Author
                            </span>
                        </p>

                        <a th:text="#{publication.download}"
                           th:href="@{/files/{id}(id=${correction.id})}"
                           class="btn btn-outline-primary btn-sm d-inline-flex align-items-center gap-1 px-2 py-1">
                            <i class="bi bi-download"></i> Download
                        </a>
                    </div>

                    <!-- Delete Correction Form -->
                    <form th:action="@{/deleteCorrection/{id}(id=${correction.id})}"
                          method="post"
                          onsubmit="return confirm('Are you sure you want to delete this correction?');">
                        <button type="submit"
                                class="btn btn-outline-danger btn-sm px-2 py-1"
                                title="Delete correction">
                            <i class="bi bi-trash"></i>
                        </button>
                    </form>
                </div>

                <!-- Comment Section Fragment -->
                <div class="mt-3 pt-3 border-top"
                     th:replace="~{fragments/add-comment-correction :: addCommentCorrection(correction=${correction}, comments=${correction.comments})}">
                </div>

            </div>
        </div>
    </div>

    <!-- Empty State -->
    <div th:if="${publication.corrections == null or publication.corrections.isEmpty()}"
         class="alert alert-white bg-white border text-muted py-2 px-3 rounded-3 small mb-3">
        <i class="bi bi-info-circle me-2"></i>No corrections have been published yet.
    </div>

    <!-- Collapsible Toggle Bar for Adding Correction -->
    <div class="card border border-dashed bg-white shadow-none rounded-3">
        <div class="card-body p-2 text-center">
            <div class="py-1"
                 role="button"
                 tabindex="0"
                 data-bs-toggle="collapse"
                 th:data-bs-target="'#correction-form-' + ${publication.id}"
                 th:aria-controls="'correction-form-' + ${publication.id}"
                 aria-expanded="false"
                 style="cursor: pointer;">
                <span class="text-primary fw-bold">+</span>
                <span class="fw-semibold text-primary small ms-1">Add a correction</span>
            </div>

            <!-- Collapsible Form -->
            <div class="collapse mt-3 text-start" th:id="'correction-form-' + ${publication.id}">
                <div class="border-top pt-3">
                    <form th:action="@{/publication/{id}/addCorrection(id=${publication.id})}"
                          method="post"
                          enctype="multipart/form-data">

                        <div class="mb-3">
                            <label th:for="'correction-title-' + ${publication.id}" class="form-label fw-medium small">
                                Correction Title
                            </label>
                            <input type="text"
                                   class="form-control form-control-sm"
                                   th:id="'correction-title-' + ${publication.id}"
                                   name="title"
                                   maxlength="255"
                                   placeholder="e.g. Corrected Exercise 3"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label th:for="'correction-file-' + ${publication.id}" class="form-label fw-medium small">
                                Correction File
                            </label>
                            <input type="file"
                                   class="form-control form-control-sm"
                                   th:id="'correction-file-' + ${publication.id}"
                                   name="file"
                                   required>
                        </div>

                        <button type="submit" class="btn btn-success btn-sm w-100">
                            <i class="bi bi-upload me-1"></i> Upload Correction
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erreur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">
        <div class="card shadow-sm mx-auto text-center" style="max-width: 500px;">
            <div class="card-body p-5">

                <h1 class="display-4 text-danger" th:text="${status}">Erreur</h1>

                <p class="lead" th:if="${status == 404}" th:text="#{error.notfound}"></p>
                <p class="lead" th:if="${status == 403}" th:text="#{error.forbidden}"></p>
                <p class="lead" th:if="${status != 404 and status != 403}" th:text="#{error.server}"></p>

                <a th:href="@{/home}" class="btn btn-primary mt-3">Return to Home</a>

            </div>
        </div>
    </div>

</body>

</html>

# ============================================================
# DEPLOY PROD
# ============================================================

deploy:
  stage: deploy
  image: alpine:latest

  dependencies:
    - test

  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - echo -e "$SSH_PRIVATE_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $IP_SERVER >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - rsync -av target/site/ $SSH_USER@$IP_SERVER:$DEST_DIR
  rules:
    - if: $CI_COMMIT_BRANCH == 'main'
      when: manual # Control
    - when: never


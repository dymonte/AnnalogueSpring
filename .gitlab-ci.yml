image: maven:3.9-eclipse-temurin-25

stages:
  - build
  - test
  # - analysis
  - deploy


build:
  stage: build

  rules:
    - if: $CI_PIPELINE_SOURCE == 'push'
      when: always
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: always
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: always
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
    - if: '$CI_COMMIT_TAG'
      when: always
    - when: never

  script:
    - mvn clean package -DskipTests

test:
  stage: test
  image: mcr.microsoft.com/playwright/java:v1.62.0-noble
  allow_failure: false

  # Run the tests
  script:
    - echo "Executing BDD scenarios with maven"
    - mvn verify

  # Store artifacts
  artifacts:
    when: always
    name: "Cucumber-Report-$CI_COMMIT_REF_SLUG"
    paths:
      - target/site
      - target/surefire-reports
      - target/failsafe-reports


